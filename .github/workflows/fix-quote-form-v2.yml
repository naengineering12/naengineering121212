name: Final Quote Cleanup

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Remove quote page remnants
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('frontend/src/App.js')
          s = p.read_text(encoding='utf-8')
          start = s.find('function Contact(){')
          end = s.find('\nfunction useLenis(){', start)
          if start != -1 and end != -1:
              s = s[:start] + s[end + 1:]
          s = s.replace(",['Contact','/contact']", "")
          s = s.replace('element={<Clients/>/><Route', 'element={<Clients/>}/><Route')
          s = s.replace('}/>}/><Route path="/admin"', '/><Route path="/admin"')
          s = s.replace("function Button({to='/contact',", "function Button({to='/',")
          s = s.replace('<Button testid="clients-get-quote">Get a Free Quote</Button>', '')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/App.js
          git diff --cached --quiet && exit 0
          git commit -m "Finalize quote page removal"
          git push

name: Remove Request Quote Page

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  remove-page:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove quote page and navigation links
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('frontend/src/App.js')
          s = p.read_text(encoding='utf-8')

          # Remove the complete Request a Quote / Contact page component.
          start = s.find('function Contact(){')
          end = s.find('\nfunction useLenis(){', start)
          if start != -1 and end != -1:
              s = s[:start] + s[end + 1:]

          # Remove Contact from the main and footer navigation arrays.
          s = s.replace(",['Contact','/contact']", "")

          # Remove the header Request a Quote CTA.
          s = re.sub(r'<Link className="nav-cta" to="/contact"[^>]*>.*?</Link>', '', s, flags=re.S)

          # Remove any Route whose element references Contact, regardless of formatting.
          s = re.sub(r'\s*<Route\b[^>]*?(?:Contact|contact)[^>]*?/>', '', s, flags=re.S)

          # Remove quote/contact CTA buttons that would otherwise point to the deleted page.
          s = re.sub(r'<Button\s+to="/contact"[^>]*>.*?</Button>', '', s, flags=re.S)
          s = re.sub(r'<Button\s+to="/contact"[^>]*/>', '', s, flags=re.S)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Verify no Contact component or route remains
        run: |
          ! grep -q 'function Contact()' frontend/src/App.js
          ! grep -q 'to="/contact"' frontend/src/App.js

      - name: Commit changes and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/App.js .github/workflows/remove-request-quote-page.yml
          git commit -m "Remove Request a Quote page"
          git rm .github/workflows/remove-request-quote-page.yml
          git commit -m "Remove temporary quote page workflow"
          git push

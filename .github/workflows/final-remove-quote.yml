name: Finalize Quote Page Removal

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message, 'Finalize quote page removal') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Finalize cleanup
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('frontend/src/App.js')
          s = p.read_text(encoding='utf-8')
          s = s.replace('}/>}/><Route path="/admin"', '/><Route path="/admin"')
          s = s.replace("function Button({to='/contact',", "function Button({to='/',")
          s = s.replace('<Button testid="clients-get-quote">Get a Free Quote</Button>', '')
          p.write_text(s, encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/App.js
          git commit -m "Finalize quote page removal"
          git push

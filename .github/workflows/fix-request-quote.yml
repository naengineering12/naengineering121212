name: Fix Request a Quote

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-quote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch frontend quote form
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('frontend/src/App.js')
          s = p.read_text(encoding='utf-8')
          start = s.index('function Contact(){')
          end = s.index('\nfunction useLenis(){', start)
          new = r'''function Contact(){
  const [sending,setSending]=useState(false);
  const [done,setDone]=useState(false);
  const [error,setError]=useState('');
  const submit=async(e)=>{
    e.preventDefault();
    if(sending)return;
    setSending(true);
    setDone(false);
    setError('');
    const formEl=e.currentTarget;
    const form=new FormData(formEl);
    try{
      const res=await fetch(`${API}/quote`,{method:'POST',body:form});
      if(!res.ok){
        let detail='';
        try{const data=await res.json();detail=data.detail||''}catch(_){ }
        throw new Error(detail||`Request failed (${res.status})`);
      }
      await res.json();
      setDone(true);
      toast.success('Your request has been received.');
      formEl.reset();
    }catch(err){
      const subject=encodeURIComponent(`Quote Request - ${form.get('service_required')||'Website'}`);
      const body=encodeURIComponent(`Name: ${form.get('full_name')||''}\nCompany: ${form.get('company_name')||''}\nEmail: ${form.get('email')||''}\nPhone: ${form.get('phone')||''}\nService: ${form.get('service_required')||''}\n\nRequirement:\n${form.get('message')||''}`);
      setError('Online submission could not connect. You can send the same request directly by email.');
      toast.error('Submission failed. Email option is available below.');
      window.location.href=`mailto:na.engineeringsolutions2023@gmail.com?subject=${subject}&body=${body}`;
    }finally{
      setSending(false);
    }
  };
  return <><PageIntro eyebrow="CONTACT / START A CONVERSATION" title="Let's work together">Have an engineering, supply, maintenance or project requirement? Contact NA Engineering Solutions and tell us what you need.</PageIntro><main className="section section-light"><div className="container contact-grid"><div className="contact-info"><SectionLabel>FIND US IN LAHORE</SectionLabel><h2>Bring us the requirement. We'll help shape the next step.</h2><a href="https://mail.google.com/mail/?view=cm&to=na.engineeringsolutions2023@gmail.com" target="_blank" rel="noreferrer" className="contact-line" data-testid="contact-email"><Mail/>na.engineeringsolutions2023@gmail.com</a><span className="contact-line" data-testid="contact-address"><MapPin/>593, A-Block LDA, Avenue-1, Raiwind Road, Lahore, Pakistan</span><a className="map-link-line" href="https://www.google.com/maps/search/?api=1&query=593%20A-Block%20LDA%20Avenue-1%20Raiwind%20Road%20Lahore%20Pakistan" target="_blank" rel="noreferrer" data-testid="open-map-link">Open in Google Maps <ArrowUpRight size={15}/></a></div><form className="quote-form" onSubmit={submit} data-testid="quote-form"><div className="form-head"><SectionLabel>REQUEST A QUOTE</SectionLabel><h2>Tell us what you need.</h2></div><div className="form-grid"><label>Full Name<input name="full_name" required data-testid="quote-full-name" placeholder="Your name"/></label><label>Company Name<input name="company_name" data-testid="quote-company-name" placeholder="Company (optional)"/></label><label>Email<input type="email" name="email" required data-testid="quote-email" placeholder="you@company.com"/></label><label>Phone<input name="phone" data-testid="quote-phone" placeholder="+92 ..."/></label></div><label>Service Required<select name="service_required" required data-testid="quote-service"><option value="">Select a service</option>{services.map(s=><option key={s.slug}>{s.title}</option>)}<option>General Order Supplies & Services</option><option>Other / Project Support</option></select></label><label>Message<textarea name="message" required data-testid="quote-message" placeholder="Tell us briefly about your requirement..."/></label><label className="file-input">Upload BOQ / Requirement<input type="file" name="attachment" data-testid="quote-attachment" accept=".pdf,.doc,.docx,.xls,.xlsx,.csv,.jpg,.png"/><span>Optional · PDF, spreadsheet or image up to 8 MB</span></label><button className="button form-submit" disabled={sending} data-testid="quote-submit">{sending?'Sending request...':done?'Request sent':'Submit Request'}<ArrowRight size={16}/></button>{done&&<p className="success-message" data-testid="quote-success"><CheckCircle2 size={17}/> Thank you — our team will review your requirement and respond soon.</p>}{error&&<p className="form-note" data-testid="quote-error">{error}</p>}<p className="form-note">Your request is submitted securely to our quote system. If the connection is unavailable, your email app will open with the request prepared.</p></form></div></main></>}
'''
          p.write_text(s[:start]+new+s[end:],encoding='utf-8')
          PY

      - name: Commit frontend fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/App.js
          git diff --cached --quiet && exit 0
          git commit -m "Make Request a Quote work from frontend"
          git push
name: Notify search engines with IndexNow

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "frontend/public/robots.txt"
      - "frontend/public/sitemap.xml"
      - "frontend/public/llms.txt"
      - "frontend/public/d4f79a2c6b1e4380a5f7c9d2e6b1a804.txt"

permissions:
  contents: read

jobs:
  submit:
    name: Submit production sitemap URLs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Wait for the production deployment, verify the key, and notify IndexNow
        env:
          INDEXNOW_KEY: "d4f79a2c6b1e4380a5f7c9d2e6b1a804"
        run: |
          node --input-type=module <<'NODE'
          const host = "www.naengineeringsolutions.com";
          const key = process.env.INDEXNOW_KEY;
          const keyLocation = `https://${host}/${key}.txt`;
          const sitemapUrl = `https://${host}/sitemap.xml`;
          const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

          let sitemapXml = "";
          let keyVerified = false;

          // Vercel deploys after the Git push. Retry until the new public key
          // and production sitemap are both served by the live domain.
          for (let attempt = 1; attempt <= 20; attempt += 1) {
            try {
              const [sitemapResponse, keyResponse] = await Promise.all([
                fetch(sitemapUrl, { cache: "no-store" }),
                fetch(keyLocation, { cache: "no-store" })
              ]);

              if (sitemapResponse.ok && keyResponse.ok) {
                const publishedKey = (await keyResponse.text()).trim();
                if (publishedKey === key) {
                  sitemapXml = await sitemapResponse.text();
                  keyVerified = true;
                  break;
                }
              }
            } catch (error) {
              console.log(`Attempt ${attempt}: production is not ready yet (${error.message})`);
            }

            console.log(`Attempt ${attempt}/20: waiting 15 seconds for Vercel production deployment.`);
            await wait(15_000);
          }

          if (!keyVerified || !sitemapXml) {
            throw new Error("Production sitemap or IndexNow key file was not available after 5 minutes.");
          }

          const urls = sitemapXml
  .split("<loc>")
  .slice(1)
  .map((chunk) => chunk.split("</loc>")[0].trim())
  .filter((url) => url.startsWith(`https://${host}/`));

          if (urls.length === 0) {
            throw new Error("No valid production URLs were found in sitemap.xml.");
          }

          const response = await fetch("https://api.indexnow.org/indexnow", {
            method: "POST",
            headers: { "Content-Type": "application/json; charset=utf-8" },
            body: JSON.stringify({
              host,
              key,
              keyLocation,
              urlList: urls
            })
          });

          const responseText = await response.text();
          if (response.status !== 200 && response.status !== 202) {
            throw new Error(`IndexNow rejected the submission: HTTP ${response.status} ${responseText}`);
          }

          console.log(`IndexNow accepted ${urls.length} URLs. HTTP ${response.status}. ${responseText}`);
          NODE

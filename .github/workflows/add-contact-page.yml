name: Add Responsive Contact Page

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-contact-page:
    if: ${{ !contains(github.event.head_commit.message, 'Add responsive Contact page') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add Contact page and navigation
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('frontend/src/App.js')
          s = p.read_text(encoding='utf-8')

          s = s.replace('import "./App.css";', 'import "./App.css";\nimport "./Contact.css";', 1)

          old_nav = "const nav=[['Home','/'],['Services','/services'],['General Order Supplies','/supplies'],['IT Services','/it-services'],['Industries','/industries'],['Our Clients','/clients']];"
          new_nav = "const nav=[['Home','/'],['Services','/services'],['General Order Supplies','/supplies'],['IT Services','/it-services'],['Industries','/industries'],['Our Clients','/clients'],['Contact','/contact']];"
          s = s.replace(old_nav, new_nav, 1)

          old_footer_company = "{[['Home','/'],['Services','/services'],['General Order Supplies','/supplies'],['IT Services','/it-services'],['Industries','/industries'],['Our Clients','/clients']].map"
          new_footer_company = "{[['Home','/'],['Services','/services'],['General Order Supplies','/supplies'],['IT Services','/it-services'],['Industries','/industries'],['Our Clients','/clients'],['Contact','/contact']].map"
          s = s.replace(old_footer_company, new_footer_company, 1)

          if 'function ContactPage()' not in s:
              marker = 'function Admin(){'
              contact = r'''function ContactPage(){
  const contactCards=[
    {icon:MapPin,title:'Lahore Office',text:'593, A-Block LDA, Avenue-1, Raiwind Road, Lahore, Pakistan',href:'https://www.google.com/maps/search/?api=1&query=593%20A-Block%20LDA%20Avenue-1%20Raiwind%20Road%20Lahore%20Pakistan',label:'Open in Google Maps'},
    {icon:Mail,title:'Email Us',text:'na.engineeringsolutions2023@gmail.com',href:'mailto:na.engineeringsolutions2023@gmail.com',label:'Send an email'},
    {icon:Phone,title:'Call Us',text:'+92 300 8596393',href:'tel:+923008596393',label:'Call primary number'},
    {icon:Phone,title:'Alternate Number',text:'+92 302 6880398',href:'tel:+923026880398',label:'Call alternate number'}
  ];
  return <><PageIntro eyebrow="CONTACT / NA ENGINEERING SOLUTIONS" title="Let's work together">Have an engineering, supply, maintenance or project requirement? Contact NA Engineering Solutions directly — no form required.</PageIntro><main className="contact-page"><section className="section section-light"><div className="container contact-hero-grid"><div className="contact-copy"><SectionLabel>GET IN TOUCH</SectionLabel><h2>Speak directly with our team.</h2><p>Whether you need engineering services, industrial supplies, facility maintenance, project support or General Order Supplies & Services, our team is ready to discuss your requirement.</p><p>Choose the contact method that works best for you. You can call, email, message us on WhatsApp, visit our Lahore office or open our website.</p><div className="contact-actions"><a className="contact-action-primary" href="https://wa.me/923008596393?text=Hello%20NA%20Engineering%20Solutions%2C%20I%20would%20like%20to%20discuss%20a%20requirement." target="_blank" rel="noreferrer"><MessageCircle size={18}/> WhatsApp Us <ArrowUpRight size={16}/></a><a className="contact-action-secondary" href="mailto:na.engineeringsolutions2023@gmail.com"><Mail size={18}/> Email Us <ArrowUpRight size={16}/></a></div></div><div className="contact-cards">{contactCards.map(({icon:Icon,title,text,href,label})=><a className="contact-card" href={href} target={href.startsWith('http')?'_blank':undefined} rel={href.startsWith('http')?'noreferrer':undefined} key={title}><span className="contact-card-icon"><Icon size={22}/></span><span><b>{title}</b><strong>{text}</strong><small>{label} <ArrowUpRight size={13}/></small></span></a>)}</div></div></section><section className="section contact-dark"><div className="container contact-details-grid"><div><SectionLabel>COMPANY CONTACT DETAILS</SectionLabel><h2>NA Engineering Solutions</h2><p>General Order Supplier | Engineering | Maintenance Services</p></div><div className="contact-detail-list"><div><span>Office</span><b>593-A, Block LDA Avenue-1, Raiwind Road, Lahore, Pakistan</b></div><div><span>Phone</span><b>+92 300 8596393 &nbsp; | &nbsp; +92 302 6880398</b></div><div><span>Email</span><b>na.engineeringsolutions2023@gmail.com</b></div><div><span>Business Email</span><b>info@naengineeringsolutions.com</b></div><div><span>Website</span><a href="https://www.naengineeringsolutions.com" target="_blank" rel="noreferrer">www.naengineeringsolutions.com <ArrowUpRight size={14}/></a></div></div></div></section><section className="section section-light"><div className="container contact-services"><SectionLabel>WHAT YOU CAN CONTACT US ABOUT</SectionLabel><div className="section-heading"><h2>One team for engineering, supplies and support.</h2><p>Contact us for complete or individual requirements across our service and supply capabilities.</p></div><div className="contact-service-grid">{['Civil Engineering','HVAC Systems','Mechanical Engineering','PEB Works','Electrical Works','Fire Fighting','Safety & Security Systems','Industrial Maintenance','Mechanical & Electrical Supplies','Utilities & Facility Maintenance','General Order Supplies & Services','IT Services'].map((x,i)=><div key={x}><span>0{String(i+1).padStart(2,'0')}</span><b>{x}</b><ArrowUpRight size={15}/></div>)}</div></div></section><section className="contact-map-band"><div className="container contact-map-inner"><div><SectionLabel>VISIT OUR LAHORE OFFICE</SectionLabel><h2>593-A, Block LDA Avenue-1, Raiwind Road, Lahore.</h2><p>For directions, open our office location directly in Google Maps.</p></div><a className="contact-map-button" href="https://www.google.com/maps/search/?api=1&query=593%20A-Block%20LDA%20Avenue-1%20Raiwind%20Road%20Lahore%20Pakistan" target="_blank" rel="noreferrer">Open Google Maps <ArrowUpRight size={17}/></a></div></section></main></>}
'''
              s = s.replace(marker, contact + marker, 1)

          route_marker = '<Route path="/clients" element={<Clients/>}/>'
          if '<Route path="/contact" element={<ContactPage/>}/>' not in s:
              s = s.replace(route_marker, route_marker + '<Route path="/contact" element={<ContactPage/>}/>', 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Create responsive Contact CSS
        run: |
          cat > frontend/src/Contact.css <<'EOF'
          .contact-page{overflow:hidden}
          .contact-hero-grid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(340px,.95fr);gap:5rem;align-items:start}
          .contact-copy h2{font-size:clamp(2.4rem,5vw,4.8rem);line-height:.98;letter-spacing:-.045em;max-width:700px;margin:1rem 0 1.5rem}
          .contact-copy p{max-width:680px;font-size:1.08rem;line-height:1.8;color:var(--muted,#667085);margin:0 0 1rem}
          .contact-actions{display:flex;flex-wrap:wrap;gap:.85rem;margin-top:2rem}
          .contact-action-primary,.contact-action-secondary{display:inline-flex;align-items:center;gap:.55rem;padding:.9rem 1.15rem;text-decoration:none;font-weight:700;border:1px solid rgba(16,31,50,.15);transition:transform .2s ease,background .2s ease}
          .contact-action-primary{background:var(--navy,#101f32);color:#fff}
          .contact-action-secondary{background:#fff;color:var(--navy,#101f32)}
          .contact-action-primary:hover,.contact-action-secondary:hover,.contact-map-button:hover,.contact-card:hover{transform:translateY(-2px)}
          .contact-cards{display:grid;gap:1rem}
          .contact-card{display:flex;align-items:flex-start;gap:1rem;padding:1.25rem 1.3rem;background:#fff;border:1px solid rgba(16,31,50,.12);text-decoration:none;color:inherit;box-shadow:0 12px 35px rgba(16,31,50,.05);transition:transform .2s ease,box-shadow .2s ease}
          .contact-card:hover{box-shadow:0 16px 40px rgba(16,31,50,.1)}
          .contact-card-icon{display:grid;place-items:center;min-width:46px;width:46px;height:46px;background:var(--amber,#f5a35b);color:#101f32}
          .contact-card span:last-child{display:grid;gap:.2rem;min-width:0}
          .contact-card b{font-size:.76rem;letter-spacing:.08em;text-transform:uppercase;color:#667085}
          .contact-card strong{font-size:1rem;line-height:1.5;overflow-wrap:anywhere}
          .contact-card small{display:flex;align-items:center;gap:.25rem;margin-top:.2rem;color:#16728a;font-weight:700}
          .contact-dark{background:#101f32;color:#fff}
          .contact-details-grid{display:grid;grid-template-columns:.85fr 1.15fr;gap:5rem;align-items:start}
          .contact-dark .eyebrow{color:#f5a35b}
          .contact-dark h2{font-size:clamp(2.1rem,4vw,4rem);letter-spacing:-.04em;line-height:1;margin:1rem 0}
          .contact-dark p{color:rgba(255,255,255,.68);line-height:1.7}
          .contact-detail-list{border-top:1px solid rgba(255,255,255,.16)}
          .contact-detail-list>div{display:grid;grid-template-columns:150px 1fr;gap:1.5rem;padding:1.05rem 0;border-bottom:1px solid rgba(255,255,255,.12)}
          .contact-detail-list span{color:rgba(255,255,255,.5);font-size:.78rem;text-transform:uppercase;letter-spacing:.08em}
          .contact-detail-list b,.contact-detail-list a{color:#fff;font-size:.98rem;line-height:1.55;text-decoration:none;overflow-wrap:anywhere}
          .contact-detail-list a{display:flex;align-items:center;gap:.3rem}
          .contact-service-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid rgba(16,31,50,.12)}
          .contact-service-grid>div{display:grid;grid-template-columns:auto 1fr auto;gap:1rem;align-items:center;padding:1.1rem .9rem;border-bottom:1px solid rgba(16,31,50,.12);border-right:1px solid rgba(16,31,50,.12)}
          .contact-service-grid>div:nth-child(3n){border-right:0}
          .contact-service-grid span{font-size:.7rem;color:#8b96a5}
          .contact-service-grid b{font-size:.95rem}
          .contact-map-band{background:#f5a35b;color:#101f32}
          .contact-map-inner{display:flex;justify-content:space-between;align-items:center;gap:2rem;padding-top:4rem;padding-bottom:4rem}
          .contact-map-inner h2{font-size:clamp(2rem,4vw,3.7rem);line-height:1;letter-spacing:-.04em;max-width:800px;margin:.8rem 0}
          .contact-map-inner p{margin:0;max-width:650px;line-height:1.7}
          .contact-map-button{display:inline-flex;align-items:center;gap:.55rem;white-space:nowrap;background:#101f32;color:#fff;text-decoration:none;padding:1rem 1.2rem;font-weight:700;transition:transform .2s ease}
          @media (max-width:900px){.contact-hero-grid,.contact-details-grid{grid-template-columns:1fr;gap:3rem}.contact-service-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.contact-service-grid>div:nth-child(3n){border-right:1px solid rgba(16,31,50,.12)}.contact-service-grid>div:nth-child(2n){border-right:0}.contact-map-inner{align-items:flex-start;flex-direction:column}}
          @media (max-width:640px){.contact-hero-grid,.contact-details-grid{gap:2rem}.contact-copy h2{font-size:2.45rem}.contact-copy p{font-size:1rem}.contact-actions{flex-direction:column;align-items:stretch}.contact-action-primary,.contact-action-secondary{justify-content:center}.contact-detail-list>div{grid-template-columns:1fr;gap:.35rem}.contact-service-grid{grid-template-columns:1fr}.contact-service-grid>div,.contact-service-grid>div:nth-child(3n),.contact-service-grid>div:nth-child(2n){border-right:0}.contact-map-inner{padding-top:3rem;padding-bottom:3rem}.contact-map-button{width:100%;justify-content:center}.contact-card{padding:1rem}.contact-card-icon{min-width:42px;width:42px;height:42px}}
          EOF

      - name: Commit Contact page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/App.js frontend/src/Contact.css
          git commit -m "Add responsive Contact page"
          git rm .github/workflows/add-contact-page.yml
          git commit -m "Remove temporary contact page workflow"
          git push

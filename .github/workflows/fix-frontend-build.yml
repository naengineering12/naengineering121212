name: Fix frontend build syntax

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair chat split literal
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('frontend/src/App.js')
          s = p.read_text()
          pattern = r"const parts=buf\.split\('[^']*'\);"
          fixed = re.sub(pattern, lambda m: "const parts=buf.split('\\n\\n');", s, count=1)
          if fixed != s:
              p.write_text(fixed)
              print('Repaired chat split literal.')
          else:
              print('No repair needed.')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/App.js
          git diff --cached --quiet || (git commit -m "Correct chat stream split literal" && git push)

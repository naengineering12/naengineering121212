<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img" aria-labelledby="title desc">
  <title id="title">Engineering and industrial services</title>
  <desc id="desc">A clean navy and copper illustration of industrial buildings, construction structures and engineering lines.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07172B"/>
      <stop offset=".58" stop-color="#102D4A"/>
      <stop offset="1" stop-color="#1C4664"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8AA5B9" stop-opacity=".72"/>
      <stop offset="1" stop-color="#365B78" stop-opacity=".35"/>
    </linearGradient>
    <linearGradient id="copper" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F4A261"/>
      <stop offset="1" stop-color="#FFD0A0"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#B7CBD9" stroke-opacity=".09" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1280" height="800" fill="url(#bg)"/>
